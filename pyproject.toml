[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stampbarcode"
version = "0.1.0"
description = "Duplicate a PDF with serial barcode stamps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matthew Leingang", email = "leingang@nyu.edu" },
]
keywords = ["pdf", "barcode", "code39", "stamp", "exam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6,<7",
    "reportlab>=4.4,<5",
    "typer>=0.24",
]

[project.urls]
Homepage = "https://github.com/nyumathclinic/stampbarcode"
Issues = "https://github.com/nyumathclinic/stampbarcode/issues"
Changelog = "https://github.com/nyumathclinic/stampbarcode/blob/main/CHANGELOG.md"

[project.scripts]
stampbarcode = "stampbarcode:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["stampbarcode"]
